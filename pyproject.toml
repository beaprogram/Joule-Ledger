[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "joule-ledger"
version = "1.0.0"
description = "Six-year audit of Efficiency Nova Scotia plan vs. performance"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.10.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "pandas>=2.1.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
